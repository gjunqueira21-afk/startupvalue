services:
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be an immutable release tag or digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    environment:
      NODE_ENV: production
    logging: &production-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable release tag or digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    logging: *production-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable release tag or digest}
    security_opt:
      - no-new-privileges:true

  worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable release tag or digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    logging: *production-logging
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

  postgres:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *production-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2G

  redis:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    logging: *production-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  caddy:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    logging: *production-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
