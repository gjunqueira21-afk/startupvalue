[project]
name = "startupvalue-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<0.36",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=6.2,<7",
  "rq>=2.5,<3",
  "argon2-cffi>=25.1,<26",
  "structlog>=25.4,<26",
  "reportlab>=4.4,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "hypothesis>=6.138,<7",
  "httpx>=0.28,<0.29",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
  "pypdf>=6.1,<7",
  "types-reportlab>=4.4,<5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
