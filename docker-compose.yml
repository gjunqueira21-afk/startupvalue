name: startupvalue

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: startupvalue-frontend:dev
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      - app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    image: startupvalue-backend:dev
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      MODEL_VERSION: ${MODEL_VERSION:-3.1.0-dev}
      TAX_VERSION: ${TAX_VERSION:-br-simplified-2026.09-draft}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-startupvalue}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-startupvalue}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET must be set}
      DOMAIN: ${DOMAIN:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      REPORT_STORAGE_PATH: /data/reports
      SAMPLE_STORAGE_PATH: /data/samples
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - private_data:/data
    networks:
      - edge
      - app
      - data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    image: startupvalue-backend:dev
    command: ["/bin/sh", "-ec", "exec rq worker --url \"$${REDIS_URL}\" simulation report maintenance"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - private_data:/data
    networks:
      - app
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import os; from redis import Redis; Redis.from_url(os.environ['REDIS_URL']).ping()\""
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    image: startupvalue-backend:dev
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    working_dir: /app
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    profiles:
      - tools

  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-startupvalue}
      POSTGRES_USER: ${POSTGRES_USER:-startupvalue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.2.1-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'bind 0.0.0.0\nprotected-mode yes\nappendonly yes\nrequirepass %s\n' "$${REDIS_PASSWORD}" > /run/redis/redis.conf
        exec redis-server /run/redis/redis.conf
    volumes:
      - redis_data:/data
    tmpfs:
      - /run/redis:size=1m,mode=0700,uid=999,gid=999
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  private_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
