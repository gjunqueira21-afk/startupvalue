name: Release images

# Builds and publishes the two production images to GHCR on every push to main.
# Tags are immutable (sha-<commit>) as required by docs/DEPLOY_VPS.md; the moving
# "main" tag exists only for convenience and must never be referenced by prod env.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: .
            dockerfile: apps/frontend/Dockerfile
          - name: backend
            context: apps/backend
            dockerfile: apps/backend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
