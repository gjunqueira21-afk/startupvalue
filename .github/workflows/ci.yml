name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm --workspace apps/frontend run lint
      - run: npm --workspace apps/frontend run test
      - run: npm --workspace apps/frontend run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      # pip-audit stays unpinned on purpose: a vulnerability scanner is only
      # useful with an up-to-date advisory database.
      - run: python -m pip install --upgrade pip pip-audit uv
      # Guard the reproducibility guarantee: uv.lock must match pyproject.toml,
      # and the exported requirements must match uv.lock. Without these, editing
      # pyproject.toml would silently leave the committed locks stale.
      - run: uv lock --check
      - name: Exported requirements match uv.lock
        run: |
          uv export --no-emit-project --no-dev --format requirements-txt -o requirements.lock.txt
          uv export --no-emit-project --extra dev --format requirements-txt -o requirements-dev.lock.txt
          git diff --exit-code -- requirements.lock.txt requirements-dev.lock.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pip_audit
      - run: python -m ruff check app tests benchmarks
      - run: python -m mypy app
      - run: python -m pytest

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cp infra/env/development.env.example .env
      - run: docker compose --env-file .env config --quiet
      - run: docker compose --env-file infra/env/production.env.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - run: docker compose --env-file infra/env/production.env.example -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.hostinger.yml config --quiet
