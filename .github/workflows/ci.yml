name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm --workspace apps/frontend run lint
      - run: npm --workspace apps/frontend run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip_audit
      - run: python -m ruff check app tests benchmarks
      - run: python -m mypy app
      - run: python -m pytest

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cp infra/env/development.env.example .env
      - run: docker compose --env-file .env config --quiet
      - run: docker compose --env-file infra/env/production.env.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet
