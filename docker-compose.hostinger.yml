# Overlay for the Hostinger VPS, where a shared Traefik instance (host network,
# Docker provider with exposedbydefault=false, certresolver "letsencrypt")
# already owns ports 80/443 for every project on the machine.
#
# The bundled Caddy is parked behind a profile and Traefik routes the domain:
#   docker compose --env-file /opt/startupvalue/secrets/production.env \
#     -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.hostinger.yml up -d
#
# infra/scripts/hostinger-deploy.sh runs the whole release end to end.

services:
  caddy:
    # The shared Traefik owns 80/443 on this host; keep Caddy out of `up -d`.
    profiles:
      - local-proxy

  frontend:
    labels:
      traefik.enable: "true"
      # Traefik runs on the host network: dial the IP on the non-internal network.
      traefik.docker.network: startupvalue_edge
      traefik.http.routers.startupvalue-web.rule: "Host(`${DOMAIN:?DOMAIN must be set}`)"
      traefik.http.routers.startupvalue-web.entrypoints: websecure
      traefik.http.routers.startupvalue-web.tls.certresolver: letsencrypt
      traefik.http.routers.startupvalue-web.middlewares: startupvalue-headers@docker
      traefik.http.services.startupvalue-web.loadbalancer.server.port: "3000"
      # security headers mirrored from infra/caddy/Caddyfile.prod
      traefik.http.middlewares.startupvalue-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.startupvalue-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.startupvalue-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.startupvalue-headers.headers.frameDeny: "true"
      traefik.http.middlewares.startupvalue-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.middlewares.startupvalue-headers.headers.customResponseHeaders.Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

  backend:
    labels:
      traefik.enable: "true"
      traefik.docker.network: startupvalue_edge
      # Longer rule than startupvalue-web, so Traefik gives it priority automatically.
      traefik.http.routers.startupvalue-api.rule: "Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      traefik.http.routers.startupvalue-api.entrypoints: websecure
      traefik.http.routers.startupvalue-api.tls.certresolver: letsencrypt
      traefik.http.routers.startupvalue-api.middlewares: startupvalue-headers@docker
      traefik.http.services.startupvalue-api.loadbalancer.server.port: "8000"
